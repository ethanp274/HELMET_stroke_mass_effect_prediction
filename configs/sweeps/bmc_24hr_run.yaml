program: BMC_data_exps/model_bmc_xgb.py
method: bayes
entity: chi-oatml
project: v2_model_bmc_xgb_24_hr_run
metric:
  name: CV mean AUROC
  goal: maximize
parameters:
  lookahead_hours:
    values: [24]
  learning_rate:
    min: 0.001
    max: 0.5
  max_depth:
    min: 2
    max: 10
  min_child_weight:
    min: 1
    max: 10
  gamma:
    min: 0.0
    max: 5.0
  subsample:
    min: 0.5
    max: 1.0
  reg_lambda:
    min: 1.0
    max: 10.0
  reg_alpha:
    min: 0.0
    max: 5.0
